services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bar_manager
      POSTGRES_USER: bar_app
      POSTGRES_PASSWORD: bar_app_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bar_app -d bar_manager"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
